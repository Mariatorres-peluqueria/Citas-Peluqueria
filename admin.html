<style>
  :root{
    --crema:#f7f2e9; --beige:#ece3d2; --negro:#17140f; --negro-suave:#26221a;

  body{margin:0;background:var(--crema);color:var(--texto);font-family:'Poppins',sans-serif;min-height:100vh}
  h1,h2,h3{font-family:'Playfair Display',serif;margin:0}

  .chip{display:flex;align-items:center;gap:5px;background:var(--crema);border:1px solid var(--beige);border-radius:999px;padding:5px 10px;font-size:12px;cursor:pointer}

  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}

  .cal-dia-nombre{text-align:center;font-size:10.5px;color:var(--texto-claro);text-transform:uppercase;font-weight:600;letter-spacing:.3px}

  .cal-hoy{border-color:var(--dorado-profundo);font-weight:700}
  .cal-elegido{background:var(--negro);color:#fff;border-color:var(--negro)}
  .cal-punto{font-size:9.5px;min-width:15px;height:15px;padding:0 3px;border-radius:999px;background:var(--dorado-profundo);color:#fff;display:flex;align-items:center;justify-content:center}

  .mensaje{font-size:13px;padding:8px 12px;border-radius:8px;margin-bottom:12px}

function primerDiaDelMes(){
  const d = new Date();
  return new Date(d.getFullYear(), d.getMonth(), 1).toISOString().slice(0,10);
}

function sumarDias(fechaISO, n){
  const d = new Date(fechaISO+"T00:00:00");
  d.setDate(d.getDate()+n);
  return d.toISOString().slice(0,10);
}

/* ===================== CONTRASEÑAS: ojo + norma de seguridad ===================== */

const OJO = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';
const OJO_TACHADO = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l18 18"/><path d="M10.6 5.1A10 10 0 0 1 12 5c6.5 0 10 7 10 7a17 17 0 0 1-2.6 3.5M6.6 6.6C3.8 8.4 2 12 2 12s3.5 7 10 7a9.7 9.7 0 0 0 5.4-1.6"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>';

// Campo de contraseña con el "ojo" para verla mientras se escribe (siempre empieza oculta).
function campoClave(id, etiqueta, autocomplete){
  return `<div class="campo"><label>${etiqueta}</label>
    <div class="caja-clave">
      <input type="password" id="${id}" autocomplete="${autocomplete}">
      <button type="button" class="ver-clave" data-para="${id}" aria-label="Mostrar contraseña">${OJO}</button>
    </div>
  </div>`;
}
function enlazarOjos(){
  document.querySelectorAll(".ver-clave").forEach(b=>{
    b.onclick = (e)=>{
      e.preventDefault();
      const input = document.getElementById(b.dataset.para);
      const mostrar = input.type === "password";
      input.type = mostrar ? "text" : "password";
      b.innerHTML = mostrar ? OJO_TACHADO : OJO;
      b.setAttribute("aria-label", mostrar ? "Ocultar contraseña" : "Mostrar contraseña");
      input.focus();
    };
  });
}

// Norma de seguridad de las contraseñas nuevas (la contraseña actual no hace falta cambiarla):
// mínimo 10 caracteres, con mayúscula, minúscula, número y símbolo.
const SIMBOLOS_CLAVE = "!@#$%^&*()_+-=[]{};'\\:\"|<>?,./`~";
function fallaClave(c){
  const falta = [];
  if(!/[A-Z]/.test(c)) falta.push("una mayúscula");
  if(!/[a-z]/.test(c)) falta.push("una minúscula");
  if(!/[0-9]/.test(c)) falta.push("un número");
  if(![...c].some(x => SIMBOLOS_CLAVE.includes(x))) falta.push("un símbolo (p. ej. ! ? # . - _ @ $ % & *)");
  if(c.length < 10 || falta.length)
    return "La contraseña debe tener al menos 10 caracteres" + (c.length < 10 ? ` (tiene ${c.length})` : "")
      + (falta.length ? "; le falta " + falta.join(", ") : "") + ".";
  return null;
}

/* ===================== VERIFICACIÓN EN DOS PASOS (MFA) ===================== */
// Los administradores necesitan, además de la contraseña, un código de 6 cifras de
// una app de códigos del móvil (TOTP de Supabase Auth). La primera vez se da de alta
// (código QR); las siguientes veces solo se pide el código. Supabase, en el servidor,
// solo concede permisos de administrador con la sesión verificada (nivel "aal2") —
// esta pantalla no es solo un aviso: sin pasar por aquí, nada de lo de abajo funciona.

function vistaMFA(){
  const p = estado.mfaEnPantalla;
  return `
  <div class="pantalla-login">
    <div class="caja-login" style="text-align:center">
      <div class="sello-login"><img src="imagenes/logo-mf.jpg" alt="Logo"></div>
      <h1>Verificación en dos pasos</h1>
      ${p.alta ? `
        <p class="ayuda" style="text-align:left">Como administrador, hace falta un código del móvil además de la contraseña. Instala una app de códigos (Google Authenticator o Microsoft Authenticator) y escanea este código:</p>
        <img src="${p.qr}" alt="Código QR" style="display:block;width:180px;height:180px;margin:10px auto;background:#fff;border-radius:8px;border:1px solid var(--beige)">
        <p class="ayuda">¿No puedes escanearlo? Escribe en la app esta clave: <b style="word-break:break-all">${p.secreto}</b></p>
        <p class="ayuda">Después escribe aquí el código de 6 cifras que te muestra la app.</p>
      ` : `<p class="ayuda">Escribe el código de 6 cifras que muestra tu app de códigos.</p>`}
      ${estado.errorMfa ? `<div class="mensaje error">${estado.errorMfa}</div>` : ""}
      <div class="campo" style="text-align:left"><label>Código</label><input id="mfaCodigo" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000"></div>
      <button class="btn btn-dorado" id="btnVerificarMfa" style="width:100%">Verificar</button>
      <button class="btn btn-texto" id="btnSalirMfa" style="width:100%;margin-top:6px">Salir</button>
    </div>
  </div>`;
}

async function prepararMFA(){
  try{
    const { data: nivel } = await sb.auth.mfa.getAuthenticatorAssuranceLevel();
    if(nivel && nivel.currentLevel === "aal2"){ estado.mfaVerificado = true; return; }
    const { data: f, error } = await sb.auth.mfa.listFactors();
    if(error) throw error;
    const verificado = (f.totp || [])[0]; // (solo vienen los ya verificados)
    if(verificado){ estado.mfaEnPantalla = { factorId: verificado.id, alta: false }; return; }
    // Sin código dado de alta todavía: se limpian altas a medias y se empieza una nueva
    for(const x of (f.all || []).filter(x => x.status !== "verified")) await sb.auth.mfa.unenroll({ factorId: x.id });
    const { data: e, error: e2 } = await sb.auth.mfa.enroll({ factorType: "totp", friendlyName: "Panel María Torres" });
    if(e2) throw e2;
    estado.mfaEnPantalla = { factorId: e.id, alta: true, qr: e.totp.qr_code, secreto: e.totp.secret };
  }catch(err){
    estado.errorMfa = "No se pudo preparar la verificación en dos pasos: " + (err.message || err);
    estado.mfaEnPantalla = { factorId: null, alta: false, error: true };
  }
}

function enlazarMFA(){
  const campoCodigo = document.getElementById("mfaCodigo");
  campoCodigo.focus();
  campoCodigo.addEventListener("keydown", e=>{ if(e.key==="Enter") document.getElementById("btnVerificarMfa").click(); });
  document.getElementById("btnVerificarMfa").onclick = async ()=>{
    const codigo = campoCodigo.value.replace(/\D/g,"");
    if(codigo.length !== 6){ estado.errorMfa = "Escribe las 6 cifras del código."; render(); return; }
    const btn = document.getElementById("btnVerificarMfa");
    btn.disabled = true; btn.textContent = "Comprobando…";
    const { error } = await sb.auth.mfa.challengeAndVerify({ factorId: estado.mfaEnPantalla.factorId, code: codigo });
    if(error){
      estado.errorMfa = "Código incorrecto o caducado. Espera al siguiente código e inténtalo de nuevo.";
      render();
      return;
    }
    estado.mfaVerificado = true;
    estado.mfaEnPantalla = null;
    estado.errorMfa = null;
    render();
  };
  document.getElementById("btnSalirMfa").onclick = async ()=>{
    await sb.auth.signOut();
    estado.sesion = null; estado.esAdmin = false; estado.mfaVerificado = false; estado.mfaEnPantalla = null; estado.errorMfa = null;
    render();
  };
}

async function comprobarSesion(){
  const { data: { session } } = await sb.auth.getSession();
  estado.sesion = session;
  if(!session){ estado.esAdmin = false; render(); return; }
  const { data, error } = await sb.from("profiles").select("rol,activo,nombre").eq("id", session.user.id).maybeSingle();
  estado.esAdmin = !!(data && data.rol === "admin" && data.activo);
  estado.nombreAdmin = data?.nombre || session.user.email;
  render();
}

async function iniciar(){
  await comprobarSesion();
  sb.auth.onAuthStateChange((_evt, session) => { estado.sesion = session; });
}

/* ===================== CARGA DE DATOS ===================== */

async function cargarDatos(){
  const [sv, pr, rl, hr, ng, bl, tr] = await Promise.all([
    sb.from("services").select("*").order("categoria").order("orden"),
    sb.from("professionals").select("*").order("orden"),
    sb.from("professional_services").select("*"),
    sb.from("business_hours").select("*").order("dia_semana"),
    sb.from("business_settings").select("*").maybeSingle(),
    sb.from("blocked_slots").select("*,professionals(nombre)").order("desde"),
    sb.from("trabajos").select("*").order("orden")
  ]);
  estado.datos.servicios = sv.data || [];
  estado.datos.profesionales = pr.data || [];
  estado.datos.relacion = rl.data || [];
  estado.datos.horario = hr.data || [];
  estado.datos.negocio = ng.data;
  estado.datos.bloqueos = bl.data || [];
  estado.datos.trabajos = tr.data || [];
}

async function cargarCitasAgenda(){
  const { data, error } = await sb.from("appointments")
    .select("id,fecha,hora_inicio,hora_fin,estado,precio_total,notas_cliente,clientes(nombre,telefono,email),professionals(nombre),appointment_services(nombre_servicio)")
    .eq("fecha", estado.fechaAgenda)
    .order("hora_inicio");
  if(error){ console.error(error); estado.citasAgenda = []; return; }
  estado.citasAgenda = data || [];
}

// Para pintar un puntito con el número de citas en cada día del mes
// que se ve en el calendario (no cuenta las canceladas).
async function cargarResumenMes(){
  const { anio, mes } = estado.calendario;
  const inicio = new Date(anio, mes, 1).toISOString().slice(0,10);
  const fin = new Date(anio, mes+1, 0).toISOString().slice(0,10);
  const { data, error } = await sb.from("appointments").select("fecha,estado").gte("fecha", inicio).lte("fecha", fin);
  const resumen = {};
  if(!error){
    (data||[]).forEach(c=>{
      if(c.estado==="cancelada") return;
      resumen[c.fecha] = (resumen[c.fecha]||0) + 1;
    });
  }
  estado.resumenMes = resumen;
}

function mostrarMensaje(tipo, texto){
  estado.mensaje = { tipo, texto };
  render();
  setTimeout(()=>{ estado.mensaje=null; render(); }, 3500);
}

/* ===================== RENDER PRINCIPAL ===================== */

async function render(){
  if(estado.esAdmin === null){ raiz.innerHTML = `<div class="pantalla-login"><p class="ayuda">Comprobando acceso…</p></div>`; return; }
  if(!estado.sesion){ raiz.innerHTML = vistaLogin(estado.errorLogin); enlazarLogin(); return; }
  if(!estado.esAdmin){ raiz.innerHTML = vistaSinAcceso(estado.sesion.user.email); enlazarSalir(); return; }

  if(MFA_ACTIVO && !estado.mfaVerificado){
    if(!estado.mfaEnPantalla){
      raiz.innerHTML = `<div class="pantalla-login"><p class="ayuda">Comprobando verificación en dos pasos…</p></div>`;
      await prepararMFA();
      render();
      return;
    }
    raiz.innerHTML = vistaMFA();
    enlazarMFA();
    return;
  }

  if(estado.mostrarCambioClave){
    raiz.innerHTML = `
      <div class="topbar">
        <h1>María Torres — Panel de administración</h1>
        <div><span class="quien">${estado.nombreAdmin}</span></div>
      </div>
      <div class="contenedor">${vistaCambiarClave()}</div>`;
    enlazarCambiarClave();
    return;
  }

  if(!estado.datos.negocio && !estado._cargando){
    estado._cargando = true;
    await cargarDatos();
    estado._cargando = false;
  }
  if(estado.tab==="agenda" && estado.citasAgenda===null && !estado._cargandoAgenda){
    estado._cargandoAgenda = true;
    await cargarCitasAgenda();
    estado._cargandoAgenda = false;
  }
  if(estado.tab==="agenda" && estado.resumenMes===null && !estado._cargandoResumen){
    estado._cargandoResumen = true;
    await cargarResumenMes();
    estado._cargandoResumen = false;
  }

  raiz.innerHTML = `
    <div class="topbar">
      <h1>María Torres — Panel de administración</h1>
      <div><span class="quien">${estado.nombreAdmin}</span> &nbsp; <button class="btn btn-texto" id="btnCambiarClave" style="color:var(--dorado-suave)">Cambiar contraseña</button> &nbsp; <button class="btn btn-texto" id="btnSalir" style="color:var(--dorado-suave)">Salir</button></div>
    </div>
    <div class="tabs">
      ${["agenda","informes","negocio","servicios","profesionales","horario","vacaciones","trabajos"].map(t=>`
        <button class="tab-btn ${estado.tab===t?'activa':''}" data-tab="${t}">${etiquetaTab(t)}</button>
      `).join("")}
    </div>
    <div class="contenedor">
      ${estado.mensaje ? `<div class="mensaje ${estado.mensaje.tipo}">${estado.mensaje.texto}</div>` : ""}
      ${estado.tab==="agenda" ? vistaAgenda() : ""}
      ${estado.tab==="informes" ? vistaInformes() : ""}
      ${estado.tab==="negocio" ? vistaNegocio() : ""}
      ${estado.tab==="servicios" ? vistaServicios() : ""}
      ${estado.tab==="profesionales" ? vistaProfesionales() : ""}
      ${estado.tab==="horario" ? vistaHorario() : ""}
      ${estado.tab==="vacaciones" ? vistaVacaciones() : ""}
      ${estado.tab==="trabajos" ? vistaTrabajos() : ""}
    </div>`;
  enlazarSalir();
  document.getElementById("btnCambiarClave").onclick = ()=>{ estado.mostrarCambioClave = true; estado.errorClave = null; render(); };
  document.querySelectorAll(".tab-btn").forEach(b=>b.onclick=()=>{
    estado.tab=b.dataset.tab;
    if(estado.tab==="agenda"){ estado.citasAgenda = null; estado.resumenMes = null; }
    render();
  });
  if(estado.tab==="agenda") enlazarAgenda();
  if(estado.tab==="informes") enlazarInformes();
  if(estado.tab==="negocio") enlazarNegocio();
  if(estado.tab==="servicios") enlazarServicios();
  if(estado.tab==="profesionales") enlazarProfesionales();
  if(estado.tab==="horario") enlazarHorario();
  if(estado.tab==="vacaciones") enlazarVacaciones();
  if(estado.tab==="trabajos") enlazarTrabajos();
}

function etiquetaTab(t){
  return {agenda:"Agenda", informes:"Informes", negocio:"Datos del negocio", servicios:"Servicios y precios", profesionales:"Profesionales", horario:"Horario", vacaciones:"Vacaciones", trabajos:"Trabajos"}[t];
}

function enlazarLogin(){
  enlazarOjos();
  // "Recordarme" solo recuerda el CORREO en este dispositivo (localStorage).
  // La contraseña nunca se guarda aquí — eso lo ofrece el gestor de
  // contraseñas del propio navegador/móvil, que es mucho más seguro.
  try{
    const correoGuardado = localStorage.getItem("correoRecordado");
    if(correoGuardado){ document.getElementById("lCorreo").value = correoGuardado; document.getElementById("lRecordar").checked = true; }
  }catch(e){}
  const btn = document.getElementById("btnEntrar");
  btn.onclick = async ()=>{
    btn.disabled = true; btn.textContent = "Entrando…";
    const correo = document.getElementById("lCorreo").value.trim();
    const clave = document.getElementById("lClave").value;
    const { data, error } = await sb.auth.signInWithPassword({ email: correo, password: clave });
    if(error){
      estado.errorLogin = "Correo o contraseña incorrectos.";
      btn.disabled = false; btn.textContent = "Entrar";
      render();
      return;
    }
    try{
      if(document.getElementById("lRecordar").checked) localStorage.setItem("correoRecordado", correo);
      else localStorage.removeItem("correoRecordado");
    }catch(e){}
    estado.sesion = data.session;
    estado.errorLogin = null;
    await comprobarSesion();
  };
}

function enlazarSalir(){
  const btn = document.getElementById("btnSalir");
  if(btn) btn.onclick = async ()=>{
    await sb.auth.signOut();
    estado.sesion = null; estado.esAdmin = false; estado.mfaVerificado = false; estado.mfaEnPantalla = null; estado.errorMfa = null;
    estado.datos = { servicios:[], profesionales:[], relacion:[], horario:[], negocio:null, bloqueos:[], trabajos:[] };
    render();
  };
}

function vistaCambiarClave(){
  return `
  <div class="panel" style="max-width:420px">
    <h2>Cambiar contraseña</h2>
    <p class="ayuda">Mínimo 10 caracteres, con mayúscula, minúscula, número y símbolo. La contraseña actual sigue valiendo si no la cambias — esto es solo si quieres ponerte una nueva.</p>
    ${campoClave("ccClave1", "Nueva contraseña", "new-password")}
    ${campoClave("ccClave2", "Repítela", "new-password")}
    ${estado.errorClave ? `<div class="mensaje error">${estado.errorClave}</div>` : ""}
    <button class="btn btn-dorado" id="btnGuardarClave">Guardar contraseña</button>
    <button class="btn btn-texto" id="btnCancelarClave">Cancelar</button>
  </div>`;
}

function enlazarCambiarClave(){
  enlazarOjos();
  document.getElementById("btnCancelarClave").onclick = ()=>{ estado.mostrarCambioClave = false; estado.errorClave = null; render(); };
  document.getElementById("btnGuardarClave").onclick = async ()=>{
    const c1 = document.getElementById("ccClave1").value;
    const c2 = document.getElementById("ccClave2").value;
    const debil = fallaClave(c1);
    if(debil){ estado.errorClave = debil; render(); return; }
    if(c1 !== c2){ estado.errorClave = "Las dos contraseñas no coinciden."; render(); return; }
    const btn = document.getElementById("btnGuardarClave");
    btn.disabled = true; btn.textContent = "Guardando…";
    const { error } = await sb.auth.updateUser({ password: c1 });
    if(error){
      estado.errorClave = "No se pudo guardar: " + error.message;
      render();
      return;
    }
    estado.mostrarCambioClave = false;
    estado.errorClave = null;
    render();
    mostrarMensaje("ok", "Contraseña cambiada.");
  };
}

/* ===================== AGENDA ===================== */

function etiquetaEstadoCita(e){
  return {pendiente:"Pendiente", confirmada:"Confirmada", cancelada:"Cancelada", completada:"Completada"}[e] || e;
}

function filaCita(c){
  const servicios = (c.appointment_services||[]).map(s=>s.nombre_servicio).join(", ");
  const acciones = [];
  if(c.estado==="pendiente"){
    acciones.push(`<button class="btn btn-peq btn-dorado cambiar-estado" data-id="${c.id}" data-estado="confirmada">Confirmar</button>`);
    acciones.push(`<button class="btn btn-peq btn-texto cambiar-estado" data-id="${c.id}" data-estado="cancelada">Cancelar</button>`);
  } else if(c.estado==="confirmada"){
    acciones.push(`<button class="btn btn-peq btn-dorado cambiar-estado" data-id="${c.id}" data-estado="completada">Completada</button>`);
    acciones.push(`<button class="btn btn-peq btn-texto cambiar-estado" data-id="${c.id}" data-estado="cancelada">Cancelar</button>`);
  }
  return `<tr>
    <td>${c.hora_inicio.slice(0,5)}–${c.hora_fin.slice(0,5)}</td>
    <td>${c.clientes?.nombre||"—"}<br><span style="color:var(--texto-claro);font-size:11.5px">${c.clientes?.telefono||""}</span></td>
    <td>${c.professionals?.nombre||"—"}</td>
    <td style="font-size:12.5px">${servicios}</td>
    <td>${Number(c.precio_total).toFixed(2)} €</td>
    <td><span class="badge ${c.estado==='cancelada'?'inactivo':'activo'}">${etiquetaEstadoCita(c.estado)}</span></td>
    <td style="white-space:nowrap;display:flex;align-items:center;gap:4px">${acciones.join(" ")}
      <button class="btn-x borrar-cita" data-id="${c.id}" title="Borrar cita para siempre (p. ej. una cita de prueba)">×</button>
    </td>
  </tr>`;
}

const NOMBRES_MES = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];

function vistaCalendario(){
  const { anio, mes } = estado.calendario;
  const ultimoDia = new Date(anio, mes+1, 0).getDate();
  let inicioSemana = new Date(anio, mes, 1).getDay(); // 0 = domingo
  inicioSemana = (inicioSemana + 6) % 7; // pasa a que la semana empiece en lunes
  const hoyISO = new Date().toISOString().slice(0,10);
  const resumen = estado.resumenMes || {};

  let celdas = "";
  for(let i=0; i<inicioSemana; i++) celdas += `<div class="cal-dia cal-vacio"></div>`;
  for(let d=1; d<=ultimoDia; d++){
    const fechaISO = `${anio}-${String(mes+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
    const nCitas = resumen[fechaISO] || 0;
    const clases = ["cal-dia"];
    if(fechaISO === hoyISO) clases.push("cal-hoy");
    if(fechaISO === estado.fechaAgenda) clases.push("cal-elegido");
    celdas += `<button type="button" class="${clases.join(" ")}" data-fecha="${fechaISO}">
      <span>${d}</span>
      ${nCitas>0 ? `<span class="cal-punto">${nCitas}</span>` : ""}
    </button>`;
  }

  return `
  <div class="calendario">
    <div class="cal-cabecera">
      <button class="btn btn-texto" id="btnMesAnterior" style="color:var(--texto)">←</button>
      <b>${NOMBRES_MES[mes]} ${anio}</b>
      <button class="btn btn-texto" id="btnMesSiguiente" style="color:var(--texto)">→</button>
    </div>
    <div class="cal-grid cal-grid-cabecera">${["Lun","Mar","Mié","Jue","Vie","Sáb","Dom"].map(d=>`<div class="cal-dia-nombre">${d}</div>`).join("")}</div>
    <div class="cal-grid">${celdas}</div>
    <button class="btn btn-texto btn-peq" id="btnIrHoy" style="color:var(--texto);margin-top:8px">Ir a hoy</button>
  </div>`;
}

function vistaAgenda(){
  const citas = estado.citasAgenda || [];
  const fechaBonita = new Date(estado.fechaAgenda+"T00:00:00").toLocaleDateString("es-ES", {weekday:"long", day:"numeric", month:"long"});
  return `
  <div class="panel">
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px">
      <h2>Agenda</h2>
      <button class="btn btn-dorado btn-peq" id="btnAbrirNuevaCita">+ Nueva cita</button>
    </div>
    ${vistaCalendario()}
  </div>
  <div class="panel">
    <h2 style="text-transform:capitalize">${fechaBonita}</h2>
    ${estado._cargandoAgenda ? `<p class="ayuda">Cargando…</p>` : citas.length===0 ? `<p class="ayuda">No hay citas este día.</p>` : `
    <div style="overflow-x:auto">
    <table class="tabla-admin">
      <tr><th>Hora</th><th>Cliente</th><th>Profesional</th><th>Servicios</th><th>Precio</th><th>Estado</th><th></th></tr>
      ${citas.map(c=>filaCita(c)).join("")}
    </table>
    </div>`}
  </div>
  ${estado.mostrarNuevaCita ? panelNuevaCita() : ""}`;
}

function panelNuevaCita(){
  return `
  <div class="panel">
    <h2>Nueva cita</h2>
    <p class="ayuda">Para apuntar una reserva hecha por teléfono o en persona. Se comprueba la disponibilidad igual que en la web.</p>
    <div class="fila-campos">
      <div class="campo"><label>Nombre del cliente</label><input id="ncNombre"></div>

      <div class="chips-servicios">
        ${estado.datos.servicios.filter(s=>s.activo).map(s=>`<label class="chip"><input type="checkbox" class="ncServicio" value="${s.id}"> ${s.nombre} (${s.precio}€)</label>`).join("")}

    </div>
    <div class="fila-campos">
      <div class="campo"><label>Profesional</label>
        <select id="ncProfesional">
          <option value="">El primero disponible</option>
          ${estado.datos.profesionales.filter(p=>p.activo).map(p=>`<option value="${p.id}">${p.nombre}</option>`).join("")}
        </select>
      </div>
      <div class="campo"><label>Fecha</label><input type="date" id="ncFecha" value="${estado.fechaAgenda}"></div>
      <div class="campo"><label>Hora (ej. 10:00)</label><input type="text" id="ncHora" placeholder="10:00"></div>
    </div>
    <button class="btn btn-dorado" id="btnCrearCita">Crear cita</button>
    <button class="btn btn-texto" id="btnCancelarNuevaCita">Cancelar</button>

function enlazarAgenda(){
  document.querySelectorAll(".cal-dia[data-fecha]").forEach(btn=>btn.onclick = ()=>{
    estado.fechaAgenda = btn.dataset.fecha;
    estado.citasAgenda = null;
    render();
  });
  document.getElementById("btnMesAnterior").onclick = ()=>{
    estado.calendario.mes--;
    if(estado.calendario.mes < 0){ estado.calendario.mes = 11; estado.calendario.anio--; }
    estado.resumenMes = null;
    render();
  };
  document.getElementById("btnMesSiguiente").onclick = ()=>{
    estado.calendario.mes++;
    if(estado.calendario.mes > 11){ estado.calendario.mes = 0; estado.calendario.anio++; }
    estado.resumenMes = null;
    render();
  };
  document.getElementById("btnIrHoy").onclick = ()=>{
    const hoy = new Date();
    estado.calendario = { anio: hoy.getFullYear(), mes: hoy.getMonth() };
    estado.fechaAgenda = hoy.toISOString().slice(0,10);
    estado.citasAgenda = null;
    estado.resumenMes = null;
    render();
  };
  document.getElementById("btnAbrirNuevaCita").onclick = ()=>{ estado.mostrarNuevaCita = true; render(); };
  const btnCancelarNueva = document.getElementById("btnCancelarNuevaCita");
  if(btnCancelarNueva) btnCancelarNueva.onclick = ()=>{ estado.mostrarNuevaCita = false; render(); };

  document.querySelectorAll(".cambiar-estado").forEach(btn=>btn.onclick = async ()=>{
    btn.disabled = true;
    const { error } = await sb.from("appointments").update({ estado: btn.dataset.estado }).eq("id", btn.dataset.id);
    if(error){ mostrarMensaje("error", "No se pudo actualizar: " + error.message); btn.disabled = false; return; }
    estado.citasAgenda = null;
    estado.resumenMes = null;
    await cargarCitasAgenda();
    await cargarResumenMes();
    mostrarMensaje("ok", "Cita actualizada.");
  });

  document.querySelectorAll(".borrar-cita").forEach(btn=>btn.onclick = async ()=>{
    if(!confirm("¿Borrar esta cita para siempre? No se puede deshacer (útil para quitar citas de prueba). No es lo mismo que cancelar.")) return;
    btn.disabled = true;
    const { error, count } = await sb.from("appointments").delete({ count: "exact" }).eq("id", btn.dataset.id);
    if(error){ mostrarMensaje("error", "No se pudo borrar: " + error.message); btn.disabled = false; return; }
    if(!count){ mostrarMensaje("error", "No se ha borrado ninguna cita (puede que ya no exista)."); btn.disabled = false; return; }
    estado.citasAgenda = null;
    estado.resumenMes = null;
    await cargarCitasAgenda();
    await cargarResumenMes();
    mostrarMensaje("ok", "Cita borrada.");
  });

  const btnCrear = document.getElementById("btnCrearCita");
  if(btnCrear) btnCrear.onclick = async ()=>{
    const nombre = document.getElementById("ncNombre").value.trim();
    const telefono = document.getElementById("ncTelefono").value.trim();
    const servicios = Array.from(document.querySelectorAll(".ncServicio:checked")).map(c=>c.value);
    const profesionalId = document.getElementById("ncProfesional").value || null;
    const fecha = document.getElementById("ncFecha").value;
    const hora = document.getElementById("ncHora").value.trim();
    if(!nombre || !telefono || servicios.length===0 || !fecha || !hora){
      mostrarMensaje("error", "Faltan datos: nombre, teléfono, al menos un servicio, fecha y hora.");
      return;
    }
    btnCrear.disabled = true; btnCrear.textContent = "Creando…";
    const { error } = await sb.rpc("crear_cita", {
      p_nombre: nombre, p_telefono: telefono,
      p_email: document.getElementById("ncEmail").value.trim() || null,
      p_acepta_marketing: false, p_notas: null,
      p_profesional_id: profesionalId, p_servicios_ids: servicios,
      p_fecha: fecha, p_hora_inicio: hora
    });
    if(error){ mostrarMensaje("error", "No se pudo crear: " + error.message); btnCrear.disabled=false; btnCrear.textContent="Crear cita"; return; }
    estado.mostrarNuevaCita = false;
    estado.fechaAgenda = fecha;
    estado.citasAgenda = null;
    await cargarCitasAgenda();
    mostrarMensaje("ok", "Cita creada.");
  };
}

function vistaInformes(){
  return `
  <div class="panel">
    <h2>Citas e ingresos previstos</h2>
    <p class="ayuda">Descarga un Excel con todas las citas del periodo elegido y un resumen de ingresos. "Previstos" porque es el precio de la cita, no si ya se ha cobrado.</p>
    <div class="fila-campos">
      <div class="campo"><label>Desde</label><input type="date" id="infDesde" value="${estado.informeDesde}"></div>
      <div class="campo"><label>Hasta</label><input type="date" id="infHasta" value="${estado.informeHasta}"></div>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px">
      <button class="btn btn-peq btn-texto" id="btnRangoHoy" style="color:var(--texto)">Hoy</button>
      <button class="btn btn-peq btn-texto" id="btnRangoSemana" style="color:var(--texto)">Esta semana</button>
      <button class="btn btn-peq btn-texto" id="btnRangoMes" style="color:var(--texto)">Este mes</button>
    </div>
    <button class="btn btn-dorado" id="btnDescargarExcel">⬇ Descargar Excel</button>
    <div id="resumenInforme" style="margin-top:18px"></div>
  </div>
  <div class="panel" style="margin-top:22px">
    <h2>Copia de seguridad</h2>
    <p class="ayuda">Descarga un archivo con todos los datos del negocio (citas, clientes, servicios, profesionales, horario y ajustes) por si algún día se necesitan recuperar. Guárdalo en un sitio seguro, por ejemplo tu correo o una carpeta en el ordenador.</p>
    <button class="btn btn-negro" id="btnCopiaSeguridad">⬇ Descargar copia de seguridad</button>
  </div>`;
}

function inicioSemana(fechaISO){
  const d = new Date(fechaISO+"T00:00:00");
  const diff = (d.getDay()+6)%7; // lunes=0
  d.setDate(d.getDate()-diff);
  return d.toISOString().slice(0,10);
}

function enlazarInformes(){
  document.getElementById("btnRangoHoy").onclick = ()=>{
    const hoy = new Date().toISOString().slice(0,10);
    estado.informeDesde = hoy; estado.informeHasta = hoy; render();
  };
  document.getElementById("btnRangoSemana").onclick = ()=>{
    const hoy = new Date().toISOString().slice(0,10);
    estado.informeDesde = inicioSemana(hoy); estado.informeHasta = sumarDias(inicioSemana(hoy),6); render();
  };
  document.getElementById("btnRangoMes").onclick = ()=>{
    estado.informeDesde = primerDiaDelMes(); estado.informeHasta = new Date().toISOString().slice(0,10); render();
  };
  document.getElementById("infDesde").onchange = (e)=>{ estado.informeDesde = e.target.value; };
  document.getElementById("infHasta").onchange = (e)=>{ estado.informeHasta = e.target.value; };

  document.getElementById("btnDescargarExcel").onclick = async (e)=>{
    const btn = e.target; btn.disabled = true; btn.textContent = "Preparando…";
    const desde = document.getElementById("infDesde").value;
    const hasta = document.getElementById("infHasta").value;
    const { data, error } = await sb.from("appointments")
      .select("fecha,hora_inicio,hora_fin,estado,precio_total,clientes(nombre,telefono),professionals(nombre),appointment_services(nombre_servicio)")
      .gte("fecha", desde).lte("fecha", hasta)
      .order("fecha").order("hora_inicio");
    btn.disabled = false; btn.textContent = "⬇ Descargar Excel";
    if(error){ mostrarMensaje("error", "No se pudo generar: " + error.message); return; }
    if(!data.length){ mostrarMensaje("error", "No hay citas en ese periodo."); return; }
    generarExcel(data, desde, hasta);
  };

  document.getElementById("btnCopiaSeguridad").onclick = async (e)=>{
    const btn = e.target; btn.disabled = true; btn.textContent = "Preparando…";
    const [cl, ap, asv, sv, pr, rl, hr, ng, bl] = await Promise.all([
      sb.from("clientes").select("*"),
      sb.from("appointments").select("*"),
      sb.from("appointment_services").select("*"),
      sb.from("services").select("*"),
      sb.from("professionals").select("*"),
      sb.from("professional_services").select("*"),
      sb.from("business_hours").select("*"),
      sb.from("business_settings").select("*"),
      sb.from("blocked_slots").select("*")
    ]);
    const error = cl.error || ap.error || asv.error || sv.error || pr.error || rl.error || hr.error || ng.error || bl.error;
    btn.disabled = false; btn.textContent = "⬇ Descargar copia de seguridad";
    if(error){ mostrarMensaje("error", "No se pudo generar la copia: " + error.message); return; }
    const copia = {
      generado: new Date().toISOString(),
      clientes: cl.data, appointments: ap.data, appointment_services: asv.data,
      services: sv.data, professionals: pr.data, professional_services: rl.data,
      business_hours: hr.data, business_settings: ng.data, blocked_slots: bl.data
    };
    const blob = new Blob([JSON.stringify(copia, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = `copia-seguridad_${new Date().toISOString().slice(0,10)}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
    mostrarMensaje("ok", "Copia de seguridad descargada.");
  };
}

function generarExcel(citas, desde, hasta){
  const filas = citas.map(c=>({
    "Fecha": c.fecha,
    "Hora": c.hora_inicio.slice(0,5) + "–" + c.hora_fin.slice(0,5),
    "Cliente": c.clientes?.nombre || "",
    "Teléfono": c.clientes?.telefono || "",
    "Profesional": c.professionals?.nombre || "",
    "Servicios": (c.appointment_services||[]).map(s=>s.nombre_servicio).join(", "),
    "Precio €": Number(c.precio_total),
    "Estado": etiquetaEstadoCita(c.estado)
  }));

  const cuentan = citas.filter(c=>c.estado!=="cancelada");
  const ingresos = cuentan.reduce((a,c)=>a+Number(c.precio_total),0);
  const porEstado = {};
  citas.forEach(c=>{ porEstado[c.estado] = (porEstado[c.estado]||0)+1; });

  const resumen = [
    { "Resumen del periodo": `${desde} a ${hasta}` },
    {},
    { "Resumen del periodo": "Total de citas", "": citas.length },
    { "Resumen del periodo": "Ingresos previstos (sin canceladas)", "": ingresos.toFixed(2) + " €" },
    {},
    ...Object.entries(porEstado).map(([estado,n])=>({ "Resumen del periodo": etiquetaEstadoCita(estado), "": n }))
  ];

  const libro = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(libro, XLSX.utils.json_to_sheet(filas), "Citas");
  XLSX.utils.book_append_sheet(libro, XLSX.utils.json_to_sheet(resumen), "Resumen");
  XLSX.writeFile(libro, `citas_${desde}_a_${hasta}.xlsx`);

  document.getElementById("resumenInforme").innerHTML = `
    <div class="mensaje ok">${citas.length} citas · ${ingresos.toFixed(2)} € previstos (sin contar canceladas)</div>`;
}

    const btn = e.target;
    const input = document.getElementById("nuevoArchivo");
    const archivo = input.files[0];
    if(!archivo){ mostrarMensaje("error", "Elige una foto o un vídeo primero."); return; }
    const esVideo = archivo.type.startsWith("video/");
    if(!esVideo && !archivo.type.startsWith("image/")){ mostrarMensaje("error", "Solo se admiten fotos o vídeos."); return; }
    if(archivo.size > 50*1024*1024){ mostrarMensaje("error", "El archivo pesa más de 50 MB — prueba con uno más ligero o un vídeo más corto."); return; }
    btn.disabled = true; btn.textContent = "Subiendo…";
    const extension = (archivo.name.split(".").pop() || "dat").toLowerCase();
    const ruta = `${Date.now()}-${Math.random().toString(36).slice(2,8)}.${extension}`;
    const { error: errorSubida } = await sb.storage.from("trabajos").upload(ruta, archivo);
    if(errorSubida){ mostrarMensaje("error", "No se pudo subir: " + errorSubida.message); btn.disabled=false; btn.textContent="⬆ Subir"; return; }
    const { data: urlData } = sb.storage.from("trabajos").getPublicUrl(ruta);
    const maxOrden = estado.datos.trabajos.reduce((m,t)=>Math.max(m, t.orden||0), 0);
    const { error } = await sb.from("trabajos").insert({
      tipo: esVideo ? "video" : "foto",
      url: urlData.publicUrl,
      titulo: document.getElementById("nuevoTitulo").value.trim() || null,
      orden: maxOrden + 1
    });
    btn.disabled = false; btn.textContent = "⬆ Subir";
    if(error){ mostrarMensaje("error", "No se pudo guardar: " + error.message); return; }
    await cargarDatos();
    mostrarMensaje("ok", "Subido y publicado.");
  };

  document.querySelectorAll(".guardar-trabajo").forEach(btn=>btn.onclick = async ()=>{
    const panel = btn.closest(".panel");
    const id = panel.dataset.id;
    btn.disabled = true; btn.textContent = "...";
    const { error } = await sb.from("trabajos").update({
      titulo: panel.querySelector(".tTitulo").value.trim() || null,
      orden: Number(panel.querySelector(".tOrden").value) || 0,
      activo: panel.querySelector(".tActivo").checked
    }).eq("id", id);
    if(error){ mostrarMensaje("error", "No se pudo guardar: " + error.message); btn.disabled=false; btn.textContent="Guardar"; return; }
    await cargarDatos();
    mostrarMensaje("ok", "Guardado.");
  });

  document.querySelectorAll(".borrar-trabajo").forEach(btn=>btn.onclick = async ()=>{
    const panel = btn.closest(".panel");
    const id = panel.dataset.id;
    const trabajo = estado.datos.trabajos.find(t=>t.id===id);
    if(!confirm("¿Borrar esta foto/vídeo para siempre? No se puede deshacer.")) return;
    btn.disabled = true;
    const marcador = "/storage/v1/object/public/trabajos/";
    if(trabajo && trabajo.url.includes(marcador)){
      const ruta = trabajo.url.split(marcador)[1];
      await sb.storage.from("trabajos").remove([ruta]);
    }
    const { error } = await sb.from("trabajos").delete().eq("id", id);
    if(error){ mostrarMensaje("error", "No se pudo borrar: " + error.message); btn.disabled=false; return; }
    await cargarDatos();
    mostrarMensaje("ok", "Borrado.");
  });
}

iniciar();
</script>
</body>
</html>
